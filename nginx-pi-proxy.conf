server {
    listen 80;
    server_name _;

    # Health check
    location /health {
        access_log off;
        return 200 "proxy healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy to Pi Health Server (port 9000)
    location ~ ^/api/pi:9000/(.*)$ {
        proxy_pass http://100.89.162.22:9000/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy to Pi LCD Reading Server (port 9001)
    location /api/pi/lcd/ {
        proxy_pass http://100.89.162.22:9001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy to Pi Infant Camera Stream (port 8080)
    location /api/pi/camera/ {
        proxy_pass http://100.89.162.22:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Proxy to Pi LCD Display Camera (port 8081)
    location /api/pi/lcd-camera/ {
        proxy_pass http://100.89.162.22:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Proxy to Pi NTE/Baby Server (port 8886)
    location ~ ^/api/pi:8886/(.*)$ {
        proxy_pass http://100.89.162.22:8886/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Proxy to Pi Jaundice Detection (port 8887)
    location /api/pi/jaundice/ {
        proxy_pass http://100.89.162.22:8887/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Proxy to Pi Cry Detection Server (port 8888)
    location ~ ^/api/pi:8888/(.*)$ {
        proxy_pass http://100.89.162.22:8888/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy to Pi Snapshot/Health Dashboard (port 8090)
    location /api/pi/snapshot/ {
        proxy_pass http://100.89.162.22:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Replace hardcoded Pi IP and port patterns with proxy paths
        # Camera streams
        sub_filter 'http://100.89.162.22:8080' '/api/pi/camera';
        sub_filter 'http://100.89.162.22:8081' '/api/pi/lcd-camera';
        # API endpoints
        sub_filter 'http://100.89.162.22:9001' '/api/pi/lcd';
        sub_filter 'http://100.89.162.22:8888' '/api/pi:8888';
        sub_filter 'http://100.89.162.22:8887' '/api/pi/jaundice';
        sub_filter 'http://100.89.162.22:9000' '/api/pi:9000';
        # Replace the PI_IP variable assignment
        sub_filter 'let PI_IP = "100.89.162.22"' 'let PI_IP = ""';
        sub_filter_once off;
        sub_filter_types text/javascript application/javascript;
    }
}
