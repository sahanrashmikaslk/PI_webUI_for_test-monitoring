server {
    listen 80;
    server_name _;

    # Health check
    location /health {
        access_log off;
        return 200 "proxy healthy\n";
        add_header Content-Type text/plain;
    }

    # Proxy to Pi LCD Reading Server (port 9001)
    location /api/pi/lcd/ {
        proxy_pass http://100.89.162.22:9001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Proxy to Pi Snapshot Server (port 8090)
    location /api/pi/snapshot/ {
        proxy_pass http://100.89.162.22:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Proxy to Pi Camera Server (port 8000)
    location /api/pi/camera/ {
        proxy_pass http://100.89.162.22:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Proxy to Pi Jaundice Detection (port 5002)
    location /api/pi/jaundice/ {
        proxy_pass http://100.89.162.22:5002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
