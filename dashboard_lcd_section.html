<!--
  JAVASCRIPT FUNCTIONS
  Add these functions to the <script> section at the bottom of index.html
  Location: After the existing "=== CRY DETECTION FUNCTIONS ===" section
-->
<script>
  // === LCD READING FUNCTIONS ===

  let isLCDMonitoring = false;
  let lcdInterval;
  const LCD_PORT = 9001;

  function toggleLCDMonitoring() {
    if (isLCDMonitoring) {
      stopLCDMonitoring();
    } else {
      startLCDMonitoring();
    }
  }

  function startLCDMonitoring() {
    if (isLCDMonitoring) return;

    isLCDMonitoring = true;
    document.getElementById("lcdBtn").textContent = "⏹️ Stop";
    document.getElementById("lcdBtn").classList.remove("btn-success");
    document.getElementById("lcdBtn").classList.add("btn-danger");

    console.log("📊 Starting LCD reading monitoring...");

    // Fetch immediately
    fetchLCDReadings();

    // Then poll every 5 seconds
    lcdInterval = setInterval(fetchLCDReadings, 5000);

    updateLCDStatus("monitoring", "🔄 Monitoring active");
  }

  function stopLCDMonitoring() {
    if (!isLCDMonitoring) return;

    isLCDMonitoring = false;
    clearInterval(lcdInterval);

    document.getElementById("lcdBtn").textContent = "▶️ Start";
    document.getElementById("lcdBtn").classList.remove("btn-danger");
    document.getElementById("lcdBtn").classList.add("btn-success");

    console.log("⏹️ LCD reading monitoring stopped");

    updateLCDStatus("stopped", "⚪ Not monitoring");
  }

  async function fetchLCDReadings() {
    try {
      const response = await fetch(`http://${PI_IP}:${LCD_PORT}/readings`, {
        method: "GET",
        mode: "cors",
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();
      updateLCDDisplay(data);
    } catch (error) {
      console.error("❌ Error fetching LCD readings:", error);
      updateLCDStatus("error", "❌ Connection error");

      // Reset displays on error
      document.getElementById("lcdHeartRate").textContent = "--";
      document.getElementById("lcdSpO2").textContent = "--";
      document.getElementById("lcdTemp").textContent = "--";
      document.getElementById("lcdHumidity").textContent = "--";
    }
  }

  async function captureLCDReading() {
    // Disable button temporarily
    const btn = document.getElementById("lcdCaptureBtn");
    btn.disabled = true;
    btn.textContent = "⏳";

    updateLCDStatus("capturing", "📸 Capturing...");

    try {
      const response = await fetch(`http://${PI_IP}:${LCD_PORT}/capture`, {
        method: "GET",
        mode: "cors",
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const data = await response.json();
      updateLCDDisplay(data);
      updateLCDStatus(
        isLCDMonitoring ? "monitoring" : "success",
        isLCDMonitoring ? "🔄 Monitoring active" : "✅ Capture complete"
      );
    } catch (error) {
      console.error("❌ Error capturing LCD reading:", error);
      updateLCDStatus("error", "❌ Capture failed");
    } finally {
      // Re-enable button
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = "📸";
      }, 1000);
    }
  }

  function updateLCDDisplay(data) {
    if (data.status === "success" && data.readings) {
      const readings = data.readings;

      // Heart Rate
      if (readings.heart_rate_value) {
        const hr = readings.heart_rate_value;
        document.getElementById(
          "lcdHeartRate"
        ).textContent = `${hr.value} ${hr.unit}`;
        document.getElementById(
          "lcdHeartRateConf"
        ).textContent = `Confidence: ${(hr.ocr_confidence * 100).toFixed(0)}%`;

        // Color code based on range (60-220 normal)
        const hrValue = parseInt(hr.value);
        const hrColor = hrValue < 100 || hrValue > 180 ? "#ff6b6b" : "#51cf66";
        document.getElementById("lcdHeartRate").style.color = hrColor;
      } else {
        document.getElementById("lcdHeartRate").textContent = "--";
        document.getElementById("lcdHeartRateConf").textContent =
          "Not detected";
      }

      // SpO2
      if (readings.spo2_value) {
        const spo2 = readings.spo2_value;
        document.getElementById(
          "lcdSpO2"
        ).textContent = `${spo2.value}${spo2.unit}`;
        document.getElementById("lcdSpO2Conf").textContent = `Confidence: ${(
          spo2.ocr_confidence * 100
        ).toFixed(0)}%`;

        // Color code based on range (95-100 normal)
        const spo2Value = parseInt(spo2.value);
        const spo2Color = spo2Value < 95 ? "#ff6b6b" : "#51cf66";
        document.getElementById("lcdSpO2").style.color = spo2Color;
      } else {
        document.getElementById("lcdSpO2").textContent = "--";
        document.getElementById("lcdSpO2Conf").textContent = "Not detected";
      }

      // Skin Temperature
      if (readings.skin_temp_value) {
        const temp = readings.skin_temp_value;
        document.getElementById(
          "lcdTemp"
        ).textContent = `${temp.value}${temp.unit}`;
        document.getElementById("lcdTempConf").textContent = `Confidence: ${(
          temp.ocr_confidence * 100
        ).toFixed(0)}%`;

        // Color code based on range (36-37.5 normal)
        const tempValue = parseFloat(temp.value);
        const tempColor =
          tempValue < 36.0 || tempValue > 37.5 ? "#ff6b6b" : "#51cf66";
        document.getElementById("lcdTemp").style.color = tempColor;
      } else {
        document.getElementById("lcdTemp").textContent = "--";
        document.getElementById("lcdTempConf").textContent = "Not detected";
      }

      // Humidity
      if (readings.humidity_value) {
        const humidity = readings.humidity_value;
        document.getElementById(
          "lcdHumidity"
        ).textContent = `${humidity.value}${humidity.unit}`;
        document.getElementById(
          "lcdHumidityConf"
        ).textContent = `Confidence: ${(humidity.ocr_confidence * 100).toFixed(
          0
        )}%`;
      } else {
        document.getElementById("lcdHumidity").textContent = "--";
        document.getElementById("lcdHumidityConf").textContent = "Not detected";
      }

      // Update last update time
      const now = new Date();
      document.getElementById(
        "lcdLastUpdate"
      ).textContent = `Last update: ${now.toLocaleTimeString()}`;

      // Update status
      updateLCDStatus(
        "success",
        `✅ ${data.detections_count} parameter${
          data.detections_count !== 1 ? "s" : ""
        } detected`
      );
    } else if (data.status === "no_detection") {
      updateLCDStatus("warning", "⚠️ No display detected");
    } else if (data.status === "error") {
      updateLCDStatus("error", `❌ ${data.message || "Error"}`);
    } else if (data.status === "no_data") {
      updateLCDStatus("info", "ℹ️ Waiting for data...");
    }
  }

  function updateLCDStatus(type, message) {
    const statusDiv = document.getElementById("lcdStatus");
    statusDiv.textContent = message;

    // Color coding
    const colors = {
      monitoring: "#4ecdc4",
      capturing: "#f9ca24",
      success: "#51cf66",
      warning: "#ff6b6b",
      error: "#ee5a6f",
      stopped: "#6c757d",
      info: "#74b9ff",
    };

    statusDiv.style.background = colors[type] || colors.info;
    statusDiv.style.color = type === "stopped" ? "#adb5bd" : "#ffffff";
  }

  // Auto-start LCD monitoring on page load (optional)
  // Uncomment the following lines to enable auto-start:
  /*
  document.addEventListener("DOMContentLoaded", function () {
    setTimeout(() => {
      console.log("🔄 Auto-starting LCD monitoring...");
      startLCDMonitoring();
    }, 2000); // Wait 2 seconds after page load
  });
  */
</script>
