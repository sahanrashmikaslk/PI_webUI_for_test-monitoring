<!DOCTYPE html>
<html>
  <head>
    <title>Jaundice Detection Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 50px auto;
        padding: 20px;
      }
      .result {
        margin: 20px 0;
        padding: 15px;
        background: #f0f0f0;
        border-radius: 5px;
      }
      button {
        padding: 10px 20px;
        margin: 5px;
        font-size: 16px;
        cursor: pointer;
      }
      .success {
        color: green;
      }
      .error {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>🩺 Jaundice Detection Test</h1>

    <div>
      <button onclick="testAPI()">🧪 Test API Connection</button>
      <button onclick="testDetection()">🔍 Test Detection</button>
    </div>

    <div class="result" id="result">Click a button to test...</div>

    <h3>Debug Info:</h3>
    <pre id="debug"></pre>

    <script>
      const PI_IP = "100.89.162.22";
      const JAUNDICE_PORT = 8887;

      function log(message, isError = false) {
        const debugEl = document.getElementById("debug");
        const timestamp = new Date().toLocaleTimeString();
        const color = isError ? "red" : "blue";
        debugEl.innerHTML += `<span style="color: ${color}">[${timestamp}] ${message}</span>\n`;
      }

      async function testAPI() {
        const resultEl = document.getElementById("result");
        resultEl.innerHTML = "🔄 Testing API connection...";

        try {
          log(`Testing: http://${PI_IP}:${JAUNDICE_PORT}/`);

          const response = await fetch(`http://${PI_IP}:${JAUNDICE_PORT}/`, {
            method: "GET",
            headers: { Accept: "application/json" },
          });

          log(`Response status: ${response.status}`);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();
          log(`Response data: ${JSON.stringify(data, null, 2)}`);

          resultEl.innerHTML = `
                    <div class="success">✅ API Connection Successful!</div>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
        } catch (error) {
          log(`Error: ${error.message}`, true);
          resultEl.innerHTML = `
                    <div class="error">❌ API Connection Failed</div>
                    <p>${error.message}</p>
                    <p>Make sure the jaundice detection service is running on the Pi.</p>
                `;
        }
      }

      async function testDetection() {
        const resultEl = document.getElementById("result");
        resultEl.innerHTML = "🔄 Running detection...";

        try {
          log(`Testing: http://${PI_IP}:${JAUNDICE_PORT}/detect`);

          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 10000);

          const response = await fetch(
            `http://${PI_IP}:${JAUNDICE_PORT}/detect`,
            {
              method: "GET",
              signal: controller.signal,
              headers: { Accept: "application/json" },
            }
          );

          clearTimeout(timeoutId);
          log(`Response status: ${response.status}`);

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();
          log(`Detection result: ${JSON.stringify(data, null, 2)}`);

          const statusText = data.jaundice_detected
            ? "⚠️ Jaundice Detected"
            : "✅ Normal";
          const statusClass = data.jaundice_detected ? "error" : "success";

          resultEl.innerHTML = `
                    <div class="${statusClass}"><strong>${statusText}</strong></div>
                    <p><strong>Confidence:</strong> ${Math.round(
                      (data.confidence || 0) * 100
                    )}%</p>
                    <p><strong>Brightness:</strong> ${Math.round(
                      data.brightness || 0
                    )}</p>
                    <p><strong>Status:</strong> ${data.status}</p>
                    <p><strong>Message:</strong> ${data.message}</p>
                    <details>
                        <summary>Full Response</summary>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </details>
                `;
        } catch (error) {
          log(`Error: ${error.message}`, true);
          resultEl.innerHTML = `
                    <div class="error">❌ Detection Failed</div>
                    <p>${error.message}</p>
                `;
        }
      }

      // Test on load
      window.onload = function () {
        log("Test page loaded");
        log(`Target: http://${PI_IP}:${JAUNDICE_PORT}`);
      };
    </script>
  </body>
</html>
